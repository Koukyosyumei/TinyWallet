[package]
edition = "2024"
name = "tiny-wallet"
version = "0.1.0"
authors = ["Koukyosyumei <koukyosyumei@hotmail.com>"]
resolver = "2"

[[bin]]
name = "tiny-wallet"
test = false
bench = false

[dependencies]
# Logging over RTT
defmt = "1.0"
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# Cortex-M runtime + low-level access
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"

# RP2040 boot stage 2 (just a 256-byte XIP setup blob; no PAC needed yet)
rp2040-boot2 = "0.3"

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
