[package]
edition = "2024"
name = "tiny-wallet"
version = "0.1.0"
authors = ["Koukyosyumei <koukyosyumei@hotmail.com>"]
resolver = "2"

[[bin]]
name = "tiny-wallet"
test = false
bench = false

[dependencies]
# Logging over RTT
defmt = "1.0"
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# Cortex-M runtime + low-level access
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"

# RP2040 boot stage 2 (just a 256-byte XIP setup blob)
rp2040-boot2 = "0.3"

# RP2040 HAL — used for clock setup (XOSC + PLLs) and the UsbBus
# implementation. Don't enable `critical-section-impl` here; cortex-m
# already provides one and only one impl is allowed.
rp2040-hal = { version = "0.12", features = ["rt", "disable-intrinsics"] }

# USB stack
usb-device = "0.3"
usbd-serial = "0.2"

# ed25519 — `salty` is designed for Cortex-M (low stack, no alloc).
# `ed25519-compact` HardFaulted during KeyPair::from_seed on our 8K
# task stack — its scalar multiplication apparently blows past what we
# have, or hits another alignment issue.
salty = { version = "0.3", default-features = false, features = ["slow-motion"] }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
